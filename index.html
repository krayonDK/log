<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=960, height=540, user-scalable=yes">
  <title>Presensi Mobile Widget</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 960px;
      height: 540px;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
      background: none;
    }

    body {
      position: fixed;
      top: 0;
      left: 0;
    }

    .card {
      width: 960px;
      height: 540px;
      background-image: url('https://raw.githubusercontent.com/krayonDK/log/refs/heads/main/files/bg.png');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      border-radius: 0px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.1);
      padding: 45px 90px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .status {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 18px;
    }

    .status-left {
      font-weight: bold;
      font-size: 45px;
      line-height: 1.2;
      width: 600px;
      flex-shrink: 0;
      padding-right: 30px;
    }

    .status-right {
      text-align: right;
      color: #333;
    }

    .status-right .day {
      font-weight: 600;
      font-size: 51px;
    }

    .status-right .time {
      font-size: 57px;
      font-weight: bold;
    }

    .status-right .date {
      font-size: 36px;
      color: #666;
    }

    hr {
      border: none;
      border-top: 6px solid rgba(20, 36, 28, 0.5);
      margin: 21px 0;
    }

    .time-info {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-top: 0px;
      flex-grow: 1;
    }

    .entry, .exit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .icon {
      width: 90px;
      height: 90px;
    }

    .entry-text, .exit-text {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .label {
      font-size: 39px;
      color: #555;
      margin-bottom: 0px;
    }

    .time {
      font-size: 90px;
      font-weight: bold;
      color: #333;
    }

    /* Tambahan: warna status */
    .status-memenuhi {
      color: #0c9e1e; /* Hijau */
    }

    .status-belum {
      color: #de1212; /* Merah */
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="status">
      <div class="status-left"><br>Belum Memenuhi Jam Kerja</div>
      <div class="status-right">
        <div class="day">Kamis</div>
        <div class="time">07:30</div>
      </div>
    </div>
    <hr>
    <div class="time-info">
      <div class="entry">
        <div class="entry-text">
          <div class="label">Masuk</div>
          <div class="time">07:25</div>
        </div>
        <img class="icon" src="https://raw.githubusercontent.com/krayonDK/log/refs/heads/main/files/in.png" alt="Masuk">
      </div>
      <div class="exit">
        <div class="exit-text">
          <div class="label">Keluar</div>
          <div class="time">-</div>
        </div>
        <img class="icon" src="https://raw.githubusercontent.com/krayonDK/log/refs/heads/main/files/out.png" alt="Keluar">
      </div>
    </div>
  </div>

  <script>
    const statusElem = document.querySelector('.status-left');
    if (statusElem) {
      const statusText = statusElem.textContent.trim();
      if (statusText === "Memenuhi Jam Kerja") {
        statusElem.classList.add("status-memenuhi");
      } else if (statusText === "Belum Memenuhi Jam Kerja") {
        statusElem.classList.add("status-belum");
      }
    }
  </script>
</body>
</html>
