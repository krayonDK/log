<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Presensi Widget Fixed Size</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 2000px;
      height: 900px;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
      background: url('https://raw.githubusercontent.com/krayonDK/log/refs/heads/main/files/bg.png') no-repeat center center;
      background-size: cover;
    }

    .card {
      position: absolute;
      top: 0;
      left: 0;
      width: 2000px;
      height: 900px;
      padding: 75px 150px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .status {
      display: flex;
      justify-content: space-between;
      margin-bottom: 30px;
    }

    .status-left {
      font-weight: bold;
      font-size: 75px;
      width: 1200px;
      padding-right: 50px;
    }

    .status-right {
      text-align: right;
      color: #333;
    }

    .status-right .day {
      font-weight: 600;
      font-size: 85px;
    }

    .status-right .time {
      font-size: 95px;
      font-weight: bold;
    }

    hr {
      border: none;
      border-top: 10px solid rgba(20, 36, 28, 0.5);
      margin: 35px 0;
    }

    .time-info {
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .entry, .exit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .icon {
      width: 150px;
      height: 150px;
    }

    .label {
      font-size: 65px;
      color: #555;
      margin-bottom: 0px;
    }

    .time {
      font-size: 150px;
      font-weight: bold;
      color: #333;
    }

    .status-memenuhi { color: #0c9e1e; }
    .status-belum { color: #de1212; }
  </style>
</head>
<body>
  <div class="card">
    <div class="status">
      <div class="status-left"><br>Belum Memenuhi Jam Kerja</div>
      <div class="status-right">
        <div class="day">Jumat</div>
        <div class="time">16:53</div>
      </div>
    </div>
    <hr>
    <div class="time-info">
      <div class="entry">
        <div class="label">Masuk</div>
        <div class="time">07:39</div>
        <img class="icon" src="https://raw.githubusercontent.com/krayonDK/log/refs/heads/main/files/in.png" alt="Masuk">
      </div>
      <div class="exit">
        <div class="label">Keluar</div>
        <div class="time">-</div>
        <img class="icon" src="https://raw.githubusercontent.com/krayonDK/log/refs/heads/main/files/out.png" alt="Keluar">
      </div>
    </div>
  </div>

  <script>
    const statusElem = document.querySelector('.status-left');
    if (statusElem) {
      const statusText = statusElem.textContent.trim();
      if (statusText === "Memenuhi Jam Kerja") {
        statusElem.classList.add("status-memenuhi");
      } else if (statusText === "Belum Memenuhi Jam Kerja") {
        statusElem.classList.add("status-belum");
      }
    }
  </script>
</body>
</html>
